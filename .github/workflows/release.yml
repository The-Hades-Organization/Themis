name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag, workspace and npm versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)"
          npm="$(node -p "require('./crates/strig-node/js/package.json').version")"
          echo "tag=$tag workspace=$crate npm=$npm"
          test "$tag" = "$crate"
          test "$tag" = "$npm"
          pom="$(sed -n 's#^  <version>\(.*\)</version>#\1#p' bindings/jvm/pom.xml | head -1)"
          echo "pom=$pom"
          test "$tag" = "$pom"

  crates:
    name: crates.io
    needs: verify
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish in dependency order
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in strig strig-macros strig-sync strig-redis strig-postgres strig-axum strig-server strig-cli; do
            # A rerun after a partial publish (e.g. the crates.io rate limit for new crates) skips what is already out.
            if curl -sfA "strig-release (github.com/${{ github.repository }})" \
                "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then
              echo "$crate $version is already on crates.io"
              continue
            fi
            cargo publish -p "$crate" --locked
            # The index takes a moment to list the new version for its dependents.
            sleep 30
          done

  native:
    name: native ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib: libstrig_node.so
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            lib: libstrig_node.so
          - platform: darwin-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            lib: libstrig_node.dylib
          - platform: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            lib: libstrig_node.dylib
          - platform: win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            lib: strig_node.dll
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build the N-API module
        run: cargo build -p strig-node --features napi --release --locked --target ${{ matrix.target }}
      - name: Name the binary as js/node.js expects (strig.<platform>-<arch>.node)
        run: |
          mkdir -p native
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" "native/strig.${{ matrix.platform }}.node"
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: native/strig.${{ matrix.platform }}.node
          if-no-files-found: error

  wasm:
    name: wasm
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli (same version as the crate dependency)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build the WebAssembly package
        working-directory: crates/strig-node
        run: sh scripts/build.sh wasm
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: crates/strig-node/js/wasm/
          if-no-files-found: error

  wasi:
    name: wasi module
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: The Go module at this tag embeds this engine
        run: sh bindings/scripts/build-wasi.sh check
      - name: Build the C-ABI WebAssembly module
        run: sh bindings/scripts/build-wasi.sh jvm
      - uses: actions/upload-artifact@v7
        with:
          name: wasi
          path: bindings/jvm/wasm/strig.wasm
          if-no-files-found: error

  sbom:
    name: SBOM
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate the CycloneDX documents
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir sbom
          cargo install cargo-cyclonedx --version 0.5.7 --locked
          cargo cyclonedx --format json --spec-version 1.5 --override-filename "strig-$version-crates.cdx"
          for f in $(find crates -name '*.cdx.json'); do mv "$f" "sbom/$(basename "$f")"; done
          (cd crates/strig-node/js && npm ci --ignore-scripts && \
            npm sbom --sbom-format cyclonedx --omit dev --omit peer > "../../../sbom/strig-$version-npm.cdx.json")
          ls -l sbom
          test "$(ls sbom | wc -l)" -ge 2
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [native, wasm, wasi, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: wasm
      - uses: actions/download-artifact@v8
        with:
          name: wasi
          path: wasi
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom
      - name: Name the assets after the package and version
        run: |
          version="${TAG#v}"
          mkdir dist
          cp sbom/*.json dist/
          for f in native/strig.*.node; do
            platform="$(basename "$f" .node)"
            cp "$f" "dist/strig-$version-${platform#strig.}.node"
          done
          tar czf "dist/strig-$version-wasm.tar.gz" wasm
          cp wasi/strig.wasm "dist/strig-$version.wasm"
          test "$(ls dist/*.node | wc -l)" -eq 5
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist
      - name: Take the notes from the CHANGELOG
        run: |
          version="${TAG#v}"
          awk -v h="## [$version]" 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          test -s notes.md
          cat >> notes.md <<EOF

          ## Install

          \`\`\`toml
          strig = { version = "$version" }
          \`\`\`

          \`\`\`sh
          npm install @the-hades-organization/strig@$version
          \`\`\`

          The \`.node\` files are the N-API modules, each shipped in its own npm package (\`@the-hades-organization/strig-<platform>\`); \`SHA256SUMS\` lists their hashes and the \`*.cdx.json\` files are the CycloneDX SBOMs of the crates and of the npm package.

          [crates.io](https://crates.io/crates/strig/$version) · [docs.rs](https://docs.rs/strig/$version) · [npm](https://www.npmjs.com/package/@the-hades-organization/strig/v/$version)
          EOF
          cat notes.md
      - name: Create the release or refresh its assets
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
          fi

  npm:
    name: npm
    needs: [native, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: crates/strig-node/js/native
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: crates/strig-node/js/wasm
      - name: Compile the TypeScript sources
        working-directory: crates/strig-node/js
        run: |
          npm ci
          npm run build:ts
      - name: Add the README
        run: |
          blob="https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}"
          cdn="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}"
          sed -e "s#src=\"assets/#src=\"$cdn/assets/#g" \
              -e "s#](LICENSE)#]($blob/LICENSE)#g" \
              -e "s#](README.pt-BR.md)#]($blob/README.pt-BR.md)#g" \
              -e "s#](CONTRIBUTING.md)#]($blob/CONTRIBUTING.md)#g" \
              README.md > crates/strig-node/js/README.md
      - name: Build the platform packages and pin them in the main package
        working-directory: crates/strig-node
        run: node scripts/package-platforms.mjs
      - name: Check the package contents
        working-directory: crates/strig-node/js
        run: |
          ls -l platforms/* wasm dist
          test -s dist/node.js
          test -s dist/index.d.ts
          test "$(ls platforms | wc -l)" -eq 5
          test "$(ls native | wc -l)" -eq 5
          test -s README.md
          if grep -nE '\]\((LICENSE|README\.pt-BR\.md|CONTRIBUTING\.md)\)|src="assets/' README.md; then exit 1; fi
          for dir in platforms/*/; do (cd "$dir" && npm pack --dry-run); done
          npm pack --dry-run
      - name: Publish the platform packages, then the main package
        working-directory: crates/strig-node/js
        run: |
          version="$(node -p "require('./package.json').version")"
          for dir in platforms/*/; do
            name="$(node -p "require('./$dir/package.json').name")"
            # A rerun after a partial publish skips what is already out.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            (cd "$dir" && npm publish --provenance --access public)
          done
          if npm view "@the-hades-organization/strig@$version" version >/dev/null 2>&1; then
            echo "main package $version is already on npm"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  python-wheels:
    name: python wheel ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
          - platform: darwin-x64
            os: macos-15-intel
            target: x86_64
          - platform: darwin-arm64
            os: macos-latest
            target: aarch64
          - platform: win32-x64
            os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the abi3 wheel (one wheel covers Python 3.9 and later)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist -m crates/strig-python/Cargo.toml
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  python-sdist:
    name: python sdist
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/strig-python/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  pypi:
    name: PyPI
    needs: [python-wheels, python-sdist]
    # Off unless the repository variable PYPI_PUBLISH is "true". Publishes with the PYPI_API_TOKEN secret of
    # the pypi environment. The wheels above are built on every tag either way.
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - run: ls -l dist && test "$(ls dist/*.whl | wc -l)" -eq 5 && test "$(ls dist/*.tar.gz | wc -l)" -eq 1
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
          skip-existing: true
